name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release-target:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.intent.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check explicit release intent
        id: intent
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            intent=.github/galaxunil-release
            [[ "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" == "$intent" ]] || exit 0
            [[ "$(git ls-tree "$GITHUB_SHA" "$intent" | cut -d ' ' -f 1)" == 100644 ]] || exit 1
            [[ "$(wc -l < "$intent")" == 1 ]] || exit 1
            IFS= read -r tag < "$intent"
          else
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/galaxunil-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash tools/install_android_sdk.sh
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Verify and prepare runtime assets
        run: python3 tools/bootstrap_assets.py
      - name: Test AppStream and localization
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install 'PyYAML==6.0.2'
          .ci-venv/bin/python -m unittest discover -s tests -p test_*.py -v
      - name: Android unit tests and preview APK
        run: ./gradlew --no-daemon --console=plain :app:testPlayDebugUnitTest :app:assemblePlayDebug
      - name: Stage Android preview artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/play/debug/app-play-debug.apk dist/Galaxunil-preview.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify dist/Galaxunil-preview.apk
          (cd dist && sha256sum Galaxunil-preview.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: galaxunil-preview
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

  sign-release:
    if: needs.release-target.outputs.tag != ''
    needs: [build, release-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release ref
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build the Android release APK
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/galaxunil-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash tools/install_android_sdk.sh
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          python3 tools/bootstrap_assets.py
          ./gradlew --no-daemon --console=plain \
            "-PgalaxunilVersionName=${RELEASE_TAG#v}" \
            "-PgalaxunilVersionCode=$GITHUB_RUN_NUMBER" :app:assemblePlayRelease
      - name: Sign and verify the APK
        shell: bash
        env:
          GALAXUNIL_KEYSTORE_BASE64: ${{ secrets.GALAXUNIL_KEYSTORE_BASE64 }}
          GALAXUNIL_KEY_ALIAS: ${{ secrets.GALAXUNIL_KEY_ALIAS }}
          GALAXUNIL_STORE_PASSWORD: ${{ secrets.GALAXUNIL_STORE_PASSWORD }}
          GALAXUNIL_KEY_PASSWORD: ${{ secrets.GALAXUNIL_KEY_PASSWORD }}
        run: |
          bash tools/sign_release.sh
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist-release/Galaxunil.apk |
            grep -Fi 'certificate SHA-256 digest: bd8f0cb6bc398a318d1add20061544ae46e1b45d2e102e78e79e96e2c9f67512'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: galaxunil-signed-release
          path: dist-release/
          if-no-files-found: error

  publish-release:
    if: needs.release-target.outputs.tag != ''
    needs: [sign-release, release-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: galaxunil-signed-release
          path: dist-release/
      - name: Publish the verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-target.outputs.tag }}
        run: |
          (cd dist-release && sha256sum -c SHA256SUMS)
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            options+=(--verify-tag)
          else
            set +e
            remote="$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")"
            status=$?
            set -e
            case "$status" in
              0) test "$remote" = "$(printf '%s\trefs/tags/%s' "$GITHUB_SHA" "$RELEASE_TAG")" ;;
              2) ;;
              *) exit "$status" ;;
            esac
            options+=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" dist-release/Galaxunil.apk dist-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --generate-notes "${options[@]}"
